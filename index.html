<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dark Catch Game</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 20px;
      z-index: 10;
    }

    .enemy {
      position: absolute;
      font-size: 40px;
      color: red;
      text-shadow: 0 0 10px yellow;
    }

    #player {
      position: absolute;
      bottom: 40px;
      font-size: 60px;
      animation: spin 1s linear infinite;
      color: cyan;
      text-shadow: 0 0 15px cyan;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    #gameOver {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-size: 32px;
      z-index: 20;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: cyan;
      color: black;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="score">Score: 0</div>
<div id="player">✴️</div>

<div id="gameOver">
  <div>💀 GAME OVER</div><br>
  <button onclick="location.reload()">Restart</button>
</div>

<audio id="hitSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_1c0d3c47e3.mp3?filename=laser-hit-81267.mp3"></audio>
<audio id="missSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7c93a2c5c7.mp3?filename=negative_beeps-6008.mp3"></audio>

<script>
  const player = document.getElementById("player");
  const scoreText = document.getElementById("score");
  const gameOverScreen = document.getElementById("gameOver");
  const hitSound = document.getElementById("hitSound");
  const missSound = document.getElementById("missSound");

  let score = 0;
  let gameOver = false;
  let playerX = window.innerWidth / 2;

  function movePlayer() {
    player.style.left = playerX - 30 + "px";
  }

  document.addEventListener("mousemove", e => {
    playerX = e.clientX;
    movePlayer();
  });

  document.addEventListener("touchmove", e => {
    playerX = e.touches[0].clientX;
    movePlayer();
  });

  function createEnemy() {
    if (gameOver) return;

    const enemy = document.createElement("div");
    enemy.className = "enemy";
    enemy.textContent = "⚡";
    enemy.style.left = Math.random() * (window.innerWidth - 40) + "px";
    enemy.style.top = "0px";
    document.body.appendChild(enemy);

    let y = 0;
    const speed = 3 + Math.random() * 3;

    const fall = setInterval(() => {
      if (gameOver) return clearInterval(fall);

      y += speed;
      enemy.style.top = y + "px";

      const e = enemy.getBoundingClientRect();
      const p = player.getBoundingClientRect();

      // collision
      if (
        e.bottom >= p.top &&
        e.left < p.right &&
        e.right > p.left
      ) {
        hitSound.currentTime = 0;
        hitSound.play();
        enemy.textContent = "💥";
        setTimeout(() => enemy.remove(), 100);
        clearInterval(fall);
        score++;
        scoreText.textContent = "Score: " + score;
      }

      // miss
      if (y > window.innerHeight) {
        missSound.play();
        gameOver = true;
        gameOverScreen.style.display = "flex";
        clearInterval(fall);
      }
    }, 16);
  }

  setInterval(createEnemy, 900);
</script>

</body>
</html>
